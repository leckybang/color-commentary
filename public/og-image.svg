<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Rich gradient background in Velvet Darkroom tones -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d18" />
      <stop offset="50%" stop-color="#1e1430" />
      <stop offset="100%" stop-color="#120e1a" />
    </linearGradient>

    <!-- Radial glow behind the content -->
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#c49bff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#c49bff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#c49bff" stop-opacity="0" />
    </radialGradient>

    <!-- Rainbow text gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a0ff" />
      <stop offset="35%" stop-color="#ff7a8a" />
      <stop offset="70%" stop-color="#7ab8ff" />
      <stop offset="100%" stop-color="#7fe0a0" />
    </linearGradient>

    <radialGradient id="paletteGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Subtle grain pattern (tiny dots) -->
  <g opacity="0.04" fill="#ffffff">
    <circle cx="100" cy="120" r="1" />
    <circle cx="300" cy="80" r="1" />
    <circle cx="500" cy="180" r="1" />
    <circle cx="700" cy="100" r="1" />
    <circle cx="900" cy="160" r="1" />
    <circle cx="1100" cy="120" r="1" />
    <circle cx="150" cy="300" r="1" />
    <circle cx="400" cy="350" r="1" />
    <circle cx="800" cy="320" r="1" />
    <circle cx="1050" cy="380" r="1" />
    <circle cx="200" cy="500" r="1" />
    <circle cx="600" cy="520" r="1" />
    <circle cx="1000" cy="540" r="1" />
  </g>

  <!-- Palette logomark, left-aligned -->
  <g transform="translate(120, 195)">
    <circle cx="120" cy="120" r="138" fill="url(#paletteGlow)"/>
    <rect x="34"  y="34"  width="86" height="86" rx="24" fill="#a78bfa"/>
    <rect x="120" y="34"  width="86" height="86" rx="24" fill="#fb7185"/>
    <rect x="34"  y="120" width="86" height="86" rx="24" fill="#22d3ee"/>
    <rect x="120" y="120" width="86" height="86" rx="24" fill="#34d399"/>
    <circle cx="120" cy="120" r="14" fill="#0e0c15"/>
    <circle cx="120" cy="120" r="7"  fill="#ffffff"/>
  </g>

  <!-- Text block -->
  <g transform="translate(420, 215)">
    <!-- Subtle eyebrow label -->
    <text
      x="0" y="0"
      font-family="'Karla', -apple-system, BlinkMacSystemFont, sans-serif"
      font-size="22"
      font-weight="500"
      letter-spacing="6"
      fill="#a99fc0"
    >COLOR COMMENTARY</text>

    <!-- Main tagline -->
    <text
      x="0" y="95"
      font-family="'Libre Baskerville', Georgia, serif"
      font-size="82"
      font-weight="700"
      fill="url(#titleGrad)"
    >Your media</text>
    <text
      x="0" y="180"
      font-family="'Libre Baskerville', Georgia, serif"
      font-size="82"
      font-weight="700"
      fill="url(#titleGrad)"
    >universe.</text>

    <!-- Subheading -->
    <text
      x="0" y="240"
      font-family="'Karla', -apple-system, BlinkMacSystemFont, sans-serif"
      font-size="24"
      font-weight="400"
      fill="#ede8f5"
      opacity="0.8"
    >Track. Review. Discover. Share.</text>
  </g>

  <!-- Four little media type dots bottom-left -->
  <g transform="translate(420, 520)">
    <circle cx="0" cy="0" r="6" fill="#d4a0ff" />
    <circle cx="22" cy="0" r="6" fill="#ff7a8a" />
    <circle cx="44" cy="0" r="6" fill="#7ab8ff" />
    <circle cx="66" cy="0" r="6" fill="#7fe0a0" />
    <text
      x="88" y="5"
      font-family="'Karla', sans-serif"
      font-size="14"
      letter-spacing="2"
      fill="#6e6488"
    >MUSIC · MOVIES · TV · BOOKS</text>
  </g>
</svg>
