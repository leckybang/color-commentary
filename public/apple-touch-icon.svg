<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" fill="none">
  <!-- Porcelain field (iOS masks its own corners) -->
  <rect width="180" height="180" fill="#f0efea"/>

  <!-- 2x2 palette of the four media-type colors, wordmark-style corner radii -->
  <g>
    <rect x="34" y="34" width="54" height="54" rx="16" fill="#a88ff0"/>
    <rect x="92" y="34" width="54" height="54" rx="16" fill="#f2799f"/>
    <rect x="34" y="92" width="54" height="54" rx="16" fill="#7fadea"/>
    <rect x="92" y="92" width="54" height="54" rx="16" fill="#8fae4e"/>
  </g>

  <!-- Ink dot at the seam — the "commentary" -->
  <circle cx="90" cy="90" r="10" fill="#1b1a16"/>
  <circle cx="90" cy="90" r="4.5" fill="#f0efea"/>
</svg>
