<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Dark rounded backdrop -->
  <rect x="0" y="0" width="48" height="48" rx="11" fill="#110d18"/>

  <!-- Soft glow behind the palette -->
  <circle cx="24" cy="24" r="15" fill="url(#cc-glow)" opacity="0.55"/>

  <!-- 2x2 palette of the four media-type colors. Slightly overlapping for a softer feel. -->
  <g>
    <!-- Music (purple) — top left -->
    <rect x="9" y="9" width="14.5" height="14.5" rx="4.5" fill="#a78bfa"/>
    <!-- Movies (rose) — top right -->
    <rect x="24.5" y="9" width="14.5" height="14.5" rx="4.5" fill="#fb7185"/>
    <!-- TV (cyan) — bottom left -->
    <rect x="9" y="24.5" width="14.5" height="14.5" rx="4.5" fill="#22d3ee"/>
    <!-- Books (emerald) — bottom right -->
    <rect x="24.5" y="24.5" width="14.5" height="14.5" rx="4.5" fill="#34d399"/>
  </g>

  <!-- Tiny accent dot at the seam — the "commentary" -->
  <circle cx="24" cy="24" r="2.4" fill="#110d18"/>
  <circle cx="24" cy="24" r="1.3" fill="#ffffff"/>

  <defs>
    <radialGradient id="cc-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(24 24) rotate(90) scale(16)">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
