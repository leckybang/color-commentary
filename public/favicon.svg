<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Porcelain backdrop with an ink outline — Editorial Ink, tiny edition -->
  <rect x="0" y="0" width="48" height="48" rx="11" fill="#f0efea"/>
  <rect x="1.25" y="1.25" width="45.5" height="45.5" rx="10" fill="none" stroke="#1b1a16" stroke-width="2.5"/>

  <!-- 2x2 palette of the four media-type colors -->
  <g>
    <!-- Music (lavender) — top left -->
    <rect x="9.5" y="9.5" width="14" height="14" rx="4.5" fill="#a88ff0"/>
    <!-- Movies (pink) — top right -->
    <rect x="24.5" y="9.5" width="14" height="14" rx="4.5" fill="#f2799f"/>
    <!-- TV (sky) — bottom left -->
    <rect x="9.5" y="24.5" width="14" height="14" rx="4.5" fill="#7fadea"/>
    <!-- Books (olive) — bottom right -->
    <rect x="24.5" y="24.5" width="14" height="14" rx="4.5" fill="#8fae4e"/>
  </g>

  <!-- Ink dot at the seam — the "commentary" -->
  <circle cx="24" cy="24" r="2.6" fill="#1b1a16"/>
  <circle cx="24" cy="24" r="1.3" fill="#f0efea"/>
</svg>
